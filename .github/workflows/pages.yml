# Deploys the static dashboard to GitHub Pages when the app changes.
# The data feed is NOT part of this deployment — the dashboard fetches it
# from the data branch via raw.githubusercontent.com, refreshed every poll
# by the collect workflow.

name: pages

on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
