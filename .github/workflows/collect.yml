# The zero-infrastructure deploy, hardened against GitHub cron throttling.
#
# GitHub's `schedule` events proved wildly unreliable for a 15-minute cadence
# (observed overnight: polls 2.6-3.7 HOURS apart), so this workflow is a
# LONG-RUNNER: one job loops collect-and-publish every 15 minutes for ~5.3
# hours, then dispatches its own successor (workflow_dispatch via
# GITHUB_TOKEN is a documented exception to the no-recursion rule). The cron
# below is only a resurrection backstop for the rare hard runner death —
# the concurrency group keeps at most one runner plus one queued successor.
#
# Each iteration commits BOTH the running state and the dashboard's data
# feed to the orphan `data` branch (a public, tamper-evident audit log); the
# dashboard reads the feed from raw.githubusercontent.com, so no Pages
# deployment is needed per poll (pages.yml redeploys the app on push).
#
# Notes:
#  - A failing poll (feed down, suspect snapshot rejected) logs and retries
#    at the next tick; episode models treat missed polls with flap grace.
#  - Poll commits count as repository activity, so the 60-day scheduled-
#    workflow auto-disable never triggers while collection is healthy.

name: collect

on:
  schedule:
    - cron: '11,41 * * * *' # backstop only — the loop below is the cadence
  workflow_dispatch: {}

# One collector at a time; a fired backstop/successor waits in the queue.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write # push poll commits to the data branch
  actions: write # dispatch the successor run

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # < the 6 h job hard limit
    steps:
      - uses: actions/checkout@v4

      - name: Restore state from the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: .state
        continue-on-error: true # first run ever: the branch doesn't exist yet

      - name: Init state store
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .state
          cd .state
          [ -d .git ] || git init -b data .
          # When the data branch doesn't exist yet, the restore step above
          # fails mid-checkout and leaves a half-configured repo (auth set up,
          # HEAD on the wrong unborn branch) — point HEAD at data explicitly
          # so the poll commit always lands on the right branch.
          git symbolic-ref HEAD refs/heads/data
          git remote get-url origin >/dev/null 2>&1 || \
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name 'power-tracker collector'
          git config user.email 'actions@users.noreply.github.com'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install: on the file-store path the collector is dependency-free
      # (global fetch + node builtins only).
      # HOME_LAT/HOME_LON are repo secrets: the home-watch coordinates stay
      # out of the public repo; the published home.json carries only
      # covered/clear status and distances.
      - name: Collect every 15 minutes for ~5.3 hours
        env:
          STATE_PATH: ${{ github.workspace }}/.state/state.json
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LON: ${{ secrets.HOME_LON }}
        run: |
          END=$(( SECONDS + 320*60 ))
          while true; do
            if node src/collector.js; then
              mkdir -p .state/data
              cp public/data/*.json .state/data/
              (
                cd .state
                git add -A
                git commit -q -m "poll $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo 'state unchanged'
                git push -q origin data || { git pull --rebase -q origin data && git push -q origin data; }
              ) || echo '::warning::state push failed; retrying next tick'
            else
              echo '::warning::poll failed; retrying next tick'
            fi
            [ $SECONDS -ge $END ] && break
            sleep 900
          done

      # Chain the successor so the 15-minute cadence never depends on cron.
      - name: Dispatch successor run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect --ref main || echo '::warning::successor dispatch failed; cron backstop will recover'
